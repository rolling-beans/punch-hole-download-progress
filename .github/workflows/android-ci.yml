name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test
        run: ./gradlew test

      # Release signing belongs to the explicit Build/release workflow.
      # Forks and pull requests must be testable without signing secrets.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
