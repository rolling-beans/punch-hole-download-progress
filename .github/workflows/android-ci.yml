name: PHDP Signed Release CI

on:
  push:
    branches:
      - main
      - feat/progress-update-rate-motion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Load stable release signing
        env:
          CI_SIGNING_BUNDLE: ${{ secrets.PHDP_CI_SIGNING_BUNDLE }}
          EXPECTED_CERT_SHA256: ae8c40a0c63fdba4faf0589fb08f5cb0536521ad6489778447e2ac6d55208d89
        run: python3 .github/scripts/prepare-ci-signing.py

      - name: Test and assemble signed release APK
        run: |
          VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))
          ./gradlew :app:test :app:assembleRelease \
            "-Pversion.code=$VERSION_CODE" \
            "-Pversion.name=2.11.0-test.$GITHUB_RUN_NUMBER"

      - name: Verify release APK certificate
        env:
          EXPECTED_CERT_SHA256: ae8c40a0c63fdba4faf0589fb08f5cb0536521ad6489778447e2ac6d55208d89
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          report = pathlib.Path(os.environ["RUNNER_TEMP"], "apksigner.txt").read_text()
          digests = re.findall(
              r"certificate SHA-256 digest:\s*([a-fA-F0-9:]+)",
              report, re.IGNORECASE,
          )
          if not digests:
              sys.exit("apksigner reported no certificate SHA-256 digests")
          actual = {digest.replace(":", "").lower() for digest in digests}
          expected = os.environ["EXPECTED_CERT_SHA256"].replace(":", "").lower()
          print("Signed APK certificate SHA-256:", ", ".join(sorted(actual)))
          if actual != {expected}:
              sys.exit("Signed APK certificate does not match pinned signing key")
          print("Verified: expected release signing certificate")
          PY

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: phdp-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
