name: Download Simulator Signed Release APK

on:
  push:
    branches:
      - test/notification-progress-lab
    paths:
      - ".github/workflows/download-sim.yml"
      - ".github/scripts/prepare-ci-signing.py"
      - "tools/download-sim/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Build signed simulator release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Load stable release signing
        env:
          CI_SIGNING_BUNDLE: ${{ secrets.SIM_CI_SIGNING_BUNDLE }}
          EXPECTED_CERT_SHA256: 741e213bb8375d9cbf1ee24dbe295c692fa39c382ad59ed48f2d9c6682d92d90
        run: python3 .github/scripts/prepare-ci-signing.py

      - name: Test and build signed simulator release
        run: |
          VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))
          ./gradlew :tools:download-sim:testDebugUnitTest :tools:download-sim:assembleRelease \
            "-Psim.version.code=$VERSION_CODE" \
            "-Psim.version.name=1.1-ci.$GITHUB_RUN_NUMBER"

      - name: Verify release APK certificate
        env:
          EXPECTED_CERT_SHA256: 741e213bb8375d9cbf1ee24dbe295c692fa39c382ad59ed48f2d9c6682d92d90
        run: |
          APK="$(find tools/download-sim/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          report = pathlib.Path(os.environ["RUNNER_TEMP"], "apksigner.txt").read_text()
          match = re.search(
              r"Signer #1 certificate SHA-256 digest:\s*([a-fA-F0-9:]+)",
              report, re.IGNORECASE,
          )
          if not match:
              print("Certificate digest missing in apksigner report.")
              print("Certificate lines:", [
                  line for line in report.splitlines()
                  if "certificate" in line.lower() and "sha-256" in line.lower()
              ])
              sys.exit(1)
          actual = match.group(1).replace(":", "").lower()
          expected = os.environ["EXPECTED_CERT_SHA256"].replace(":", "").lower()
          print("Signed APK certificate SHA-256:", actual)
          if actual != expected:
              sys.exit("Signed APK certificate does not match pinned signing key")
          print("Verified: expected release signing certificate")
          PY

      - name: Upload signed simulator APK
        uses: actions/upload-artifact@v7
        with:
          name: notification-progress-simulator-signed-release-apk
          path: tools/download-sim/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
