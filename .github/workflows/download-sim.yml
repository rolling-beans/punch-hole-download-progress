name: Download Simulator APK

on:
  push:
    branches:
      - test/notification-progress-lab
    paths:
      - ".github/workflows/download-sim.yml"
      - "tools/download-sim/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Build standalone simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test and build simulator only
        run: ./gradlew :tools:download-sim:testDebugUnitTest :tools:download-sim:assembleDebug

      - name: Upload simulator APK
        uses: actions/upload-artifact@v7
        with:
          name: notification-progress-simulator-apk
          path: tools/download-sim/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
